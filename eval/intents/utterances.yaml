# Team-generated labeled utterances for the IRIS intent classifier.
# Structure: intent -> language -> template family -> ["<variant>: <text>", ...]
#   variant: mx (Mexico), co (Colombia), ar (Argentina) for es; br (Brazil) for pt.
# A "family" groups utterances that share one phrasing pattern (written together, same template).
# Families whose name starts with "test_" are held out entirely for the test split, so no phrasing
# template appears in both train and test (prevents template leakage). Built by
# scripts/build_intent_splits.py into train.jsonl / test.jsonl.

